[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-experience-layer"
version = "0.1.0"
description = "Local, evidence-linked reusable experience for Codex and Claude Code"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
pel = "pel.cli:main"

[tool.setuptools.packages.find]
include = ["pel*"]

[tool.setuptools.package-data]
pel = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

